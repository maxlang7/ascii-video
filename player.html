<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCII cinema</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090c0e;color:#ddd;font:14px system-ui}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;font-weight:500}canvas{display:block;width:100%;height:auto;background:#000;border:1px solid #25292c;border-radius:8px;margin:20px 0;image-rendering:auto}nav{display:flex;align-items:center;gap:16px}button,a{color:#ddd;background:#1c2226;border:1px solid #394148;padding:9px 14px;border-radius:6px;text-decoration:none;cursor:pointer}input{flex:1;min-width:40px;accent-color:#d3ae77}p{color:#929b9f}#error{color:#ffad95}</style>
<main><header><h1>ASCII cinema</h1><a href="ascii.mp4" download>Download MP4</a></header><canvas id="screen" aria-label="ASCII video"></canvas><nav><button id="play" disabled>Loading</button><input id="seek" type="range" min="0" value="0" aria-label="Seek"><span id="time"></span><button id="full">Full screen</button></nav><p id="info"></p><p id="error" role="alert"></p><!--AUDIO--></main>
<script>
const m=__META__, encoded='__DATA__';
const screen=document.getElementById('screen'),ctx=screen.getContext('2d'),play=document.getElementById('play'),seek=document.getElementById('seek'),sound=document.getElementById('sound');
const cw=m.cw||8,ch=m.ch||16;screen.width=m.cols*cw;screen.height=m.rows*ch;const atlas=new Image();if(m.atlas)atlas.src="data:image/png;base64,"+m.atlas;ctx.font='13px monospace';ctx.textBaseline='top';
let frames,playing=false,pos=0,origin=0,last=-1;const stride=m.cols*m.rows;
const clock=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function draw(i){if(i===last)return;last=i;ctx.fillStyle='#000';ctx.fillRect(0,0,screen.width,screen.height);for(let k=0;k<stride;k++){const b=frames[i*stride+k],c=b&15;if(!c)continue;if(m.atlas)ctx.drawImage(atlas,b*cw,0,cw,ch,k%m.cols*cw,Math.floor(k/m.cols)*ch,cw,ch);else{ctx.fillStyle=m.palette[b>>4];ctx.fillText(m.chars[c],k%m.cols*cw,Math.floor(k/m.cols)*ch)}}seek.value=i;document.getElementById('time').textContent=clock(i/m.fps)+' / '+clock(m.count/m.fps)}
function tick(now){if(playing){pos=Math.floor((now-origin)*m.fps/1000);if(pos>=m.count){pos=0;origin=now;if(sound){sound.currentTime=0;sound.play().catch(()=>{})}}draw(pos)}requestAnimationFrame(tick)}
play.onclick=()=>{playing=!playing;origin=performance.now()-pos*1000/m.fps;play.textContent=playing?'Pause':'Play';if(sound){sound.currentTime=pos/m.fps;if(playing)sound.play().catch(()=>{});else sound.pause()}};
seek.oninput=()=>{pos=+seek.value;origin=performance.now()-pos*1000/m.fps;draw(pos);if(sound)sound.currentTime=pos/m.fps};
document.getElementById('full').onclick=()=>screen.requestFullscreen();
(async()=>{try{if(!window.DecompressionStream)throw Error('Use a current Chrome, Firefox, Safari or Edge browser.');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));frames=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());if(frames.length!==stride*m.count)throw Error('Damaged frame data');if(m.delta)for(let i=stride;i<frames.length;i++)frames[i]^=frames[i-stride];if(m.atlas)await atlas.decode();seek.max=m.count-1;play.disabled=false;play.textContent='Play';document.getElementById('info').textContent=`${m.cols} × ${m.rows} characters · ${m.fps} fps · ${sound?'Audio included':'Silent'} · ${(bytes.length/1024).toFixed(0)} KB compressed frames`;draw(0);requestAnimationFrame(tick)}catch(e){document.getElementById('error').textContent=e.message;play.textContent='Unavailable'}})();
</script></html>
