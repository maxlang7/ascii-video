<script>
const m=__META__,screen=document.getElementById('screen'),gl=screen.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true}),ctx=gl?null:screen.getContext('2d',{alpha:false}),video=document.getElementById('source'),play=document.getElementById('play'),seek=document.getElementById('seek');
screen.width=m.cols*m.cw;screen.height=m.rows*m.ch;
const sample=document.createElement('canvas');sample.width=m.cols;sample.height=m.rows;const sx=sample.getContext('2d',{willReadFrequently:true});
const atlas=new Image();atlas.src='data:image/png;base64,'+m.atlas;const rgb=m.palette.map(s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]);
const lut=new Uint8Array(32768),cellLut=new Uint8Array(32768);for(let code=0;code<32768;code++){let r=((code>>10)&31)*255/31,g=((code>>5)&31)*255/31,b=(code&31)*255/31,p=Math.max(r,g,b,1),best=1,dist=Infinity;r=r*235/p;g=g*235/p;b=b*235/p;for(let c=1;c<16;c++){let d=(r-rgb[c][0])**2+(g-rgb[c][1])**2+(b-rgb[c][2])**2;if(d<dist){dist=d;best=c}}lut[code]=best;const rv=((code>>10)&31)*8+4,gv=((code>>5)&31)*8+4,bv=(code&31)*8+4;const gi=code===0?0:Math.min(m.chars.length-1,Math.round(((.299*rv+.587*gv+.114*bv)/255)**.62*(m.chars.length-1)));cellLut[code]=((m.color?best:3)<<4)|gi}
const gamma=Uint8Array.from({length:256},(_,v)=>Math.min(m.chars.length-1,Math.round((v/255)**.62*(m.chars.length-1))));let last=-1,draws=0,totalDrawMs=0;
const clock=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
let gpuRender;
function setupGPU(){
 if(!gl)return;
 const vertex='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const fragment=`precision highp float;uniform sampler2D sourceTex;uniform sampler2D lutTex;uniform sampler2D atlasTex;uniform vec2 resolution;uniform vec2 grid;uniform vec2 cell;uniform float vivid;uniform float glyphLast;void main(){vec2 p=vec2(gl_FragCoord.x,resolution.y-gl_FragCoord.y);vec2 xy=floor(p/cell);vec3 rgb=texture2D(sourceTex,(xy+.5)/grid).rgb;if(vivid>.5){float peak=max(max(rgb.r,rgb.g),rgb.b);float id=floor(pow(peak,.4)*glyphLast+.5);vec2 local=mod(floor(p),cell);float mask=texture2D(atlasTex,vec2((id*cell.x+local.x+.5)/(256.*cell.x),(local.y+.5)/cell.y)).r;vec3 ink=rgb*min(peak*1.4,1.)/max(peak,1./255.);gl_FragColor=vec4(ink*mask,1.);return;}vec3 q=min(floor(rgb*255./8.),vec3(31.));float code=q.r*1024.+q.g*32.+q.b;float id=floor(texture2D(lutTex,(vec2(mod(code,256.),floor(code/256.))+.5)/vec2(256.,128.)).r*255.+.5);vec2 local=mod(floor(p),cell);gl_FragColor=vec4(texture2D(atlasTex,vec2((id*cell.x+local.x+.5)/(256.*cell.x),(local.y+.5)/cell.y)).rgb,1.);}`;
 function compile(kind,text){const sh=gl.createShader(kind);gl.shaderSource(sh,text);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}
 const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const position=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
 function texture(unit,name){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(gl.getUniformLocation(program,name),unit);return t}
 texture(1,'lutTex');gl.texImage2D(gl.TEXTURE_2D,0,gl.LUMINANCE,256,128,0,gl.LUMINANCE,gl.UNSIGNED_BYTE,cellLut);texture(2,'atlasTex');gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,atlas);const sourceTexture=texture(0,'sourceTex');gl.uniform2f(gl.getUniformLocation(program,'resolution'),screen.width,screen.height);gl.uniform2f(gl.getUniformLocation(program,'grid'),m.cols,m.rows);gl.uniform2f(gl.getUniformLocation(program,'cell'),m.cw,m.ch);gl.uniform1f(gl.getUniformLocation(program,'vivid'),m.vivid?1:0);gl.uniform1f(gl.getUniformLocation(program,'glyphLast'),m.chars.length-1);gl.viewport(0,0,screen.width,screen.height);

}
function draw(){if(!video.videoWidth||!atlas.complete)return;const frame=Math.floor(video.currentTime*m.fps);if(frame===last)return;last=frame;const began=performance.now();if(gpuRender)gpuRender();else{sx.drawImage(video,0,0,m.cols,m.rows);const pixels=sx.getImageData(0,0,m.cols,m.rows).data;ctx.fillStyle='#000';ctx.fillRect(0,0,screen.width,screen.height);for(let k=0;k<m.cols*m.rows;k++){let r=pixels[k*4],g=pixels[k*4+1],b=pixels[k*4+2],gi=gamma[Math.round(.299*r+.587*g+.114*b)];if(!gi)continue;if(m.vivid){const peak=Math.max(r,g,b,1),index=Math.min(m.chars.length-1,Math.round((peak/255)**.4*(m.chars.length-1))),gain=Math.min(peak*1.4,255)/peak;ctx.font='bold 10px monospace';ctx.textBaseline='top';ctx.fillStyle=`rgb(${Math.round(r*gain)},${Math.round(g*gain)},${Math.round(b*gain)})`;ctx.fillText(m.chars[index],k%m.cols*m.cw,Math.floor(k/m.cols)*m.ch-1);continue}const ci=m.color?lut[((r>>3)<<10)|((g>>3)<<5)|(b>>3)]:3;ctx.drawImage(atlas,((ci<<4)|gi)*m.cw,0,m.cw,m.ch,k%m.cols*m.cw,Math.floor(k/m.cols)*m.ch,m.cw,m.ch)}}seek.value=video.currentTime;document.getElementById('time').textContent=clock(video.currentTime)+' / '+clock(video.duration);draws++;totalDrawMs+=performance.now()-began}
function tick(){draw();requestAnimationFrame(tick)}
play.onclick=async()=>{try{if(video.paused){await video.play();play.textContent='Pause'}else{video.pause();play.textContent='Play'}}catch(e){document.getElementById('error').textContent=e.message}};
seek.oninput=()=>{video.currentTime=+seek.value;last=-1};video.onseeked=()=>draw();document.getElementById('full').onclick=()=>screen.requestFullscreen();video.onerror=()=>document.getElementById('error').textContent='Video decoding failed. Open this file in a current browser.';
(async()=>{try{await atlas.decode();setupGPU();if(video.readyState<2)await new Promise((resolve,reject)=>{video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',reject,{once:true})});seek.max=video.duration;play.disabled=false;play.textContent='Play';document.getElementById('info').textContent=`${m.cols} × ${m.rows} characters · ${screen.width} × ${screen.height} output · ${m.fps} fps · ${m.audio?'Audio included':'Silent'}${m.vivid?' · Vivid RGB · Bold':''}`;draw();requestAnimationFrame(tick)}catch(e){document.getElementById('error').textContent='Could not load video: '+e.message}})();
