const screen=document.getElementById('screen'),ctx=screen.getContext('2d'),play=document.getElementById('play'),seek=document.getElementById('seek'),sound=document.getElementById('sound');
screen.width=m.cols*8;screen.height=m.rows*16;ctx.font='13px monospace';ctx.textBaseline='top';
let frames,playing=false,pos=0,origin=0,last=-1;const stride=m.cols*m.rows;
const clock=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function draw(i){if(i===last)return;last=i;ctx.fillStyle='#000';ctx.fillRect(0,0,screen.width,screen.height);for(let k=0;k<stride;k++){const b=frames[i*stride+k],c=b&15;if(!c)continue;ctx.fillStyle=m.palette[b>>4];ctx.fillText(m.chars[c],k%m.cols*8,Math.floor(k/m.cols)*16)}seek.value=i;document.getElementById('time').textContent=clock(i/m.fps)+' / '+clock(m.count/m.fps)}
function tick(now){if(playing){pos=Math.floor((now-origin)*m.fps/1000);if(pos>=m.count){pos=0;origin=now;if(sound){sound.currentTime=0;sound.play().catch(()=>{})}}draw(pos)}requestAnimationFrame(tick)}
play.onclick=()=>{playing=!playing;origin=performance.now()-pos*1000/m.fps;play.textContent=playing?'Pause':'Play';if(sound){sound.currentTime=pos/m.fps;if(playing)sound.play().catch(()=>{});else sound.pause()}};
seek.oninput=()=>{pos=+seek.value;origin=performance.now()-pos*1000/m.fps;draw(pos);if(sound)sound.currentTime=pos/m.fps};
document.getElementById('full').onclick=()=>screen.requestFullscreen();
(async()=>{try{if(!window.DecompressionStream)throw Error('Use a current Chrome, Firefox, Safari or Edge browser.');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));frames=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());if(frames.length!==stride*m.count)throw Error('Damaged frame data');if(m.delta)for(let i=stride;i<frames.length;i++)frames[i]^=frames[i-stride];seek.max=m.count-1;play.disabled=false;play.textContent='Play';document.getElementById('info').textContent=`${m.cols} × ${m.rows} characters · ${m.fps} fps · ${sound?'Audio included':'Silent'} · ${(bytes.length/1024).toFixed(0)} KB compressed frames`;draw(0);requestAnimationFrame(tick)}catch(e){document.getElementById('error').textContent=e.message;play.textContent='Unavailable'}})();
